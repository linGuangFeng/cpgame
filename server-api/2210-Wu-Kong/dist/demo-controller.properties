# Controller v3；端口必须由平台用 --port 注入。
controller.contract-version=3
controller.jar=dist/controller.jar
controller.main-class=com.cpgame.wukong.server.WuKongController
controller.config=dist/demo-controller.properties
controller.config-argument=--config
controller.process-mode=managed-process
controller.port-argument=--port
controller.port-range=50000-59999
controller.publish-argument=--publish
demo.mode=managed-process
demo.publish-directory=../../../publish/2210-Wu-Kong
demo.entry-file=index.html
server.bind=0.0.0.0
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8002210
session.initial-balance=100000.00
