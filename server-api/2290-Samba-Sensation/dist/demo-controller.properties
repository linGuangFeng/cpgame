# Controller交付合同v3：由平台为本游戏启动一个独立受管Java进程，并动态分配50000-59999端口。
# 本文件不写死端口；平台通过下列参数、系统属性或环境变量注入实际5xxxx端口。
controller.contract-version=3
controller.jar=dist/controller.jar
controller.main-class=com.cpgame.sambasensation.server.SambaSensationController
controller.config=dist/controller.properties
controller.config-optional=true
controller.config-argument=--config
controller.process-mode=managed-process
controller.port-argument=--port
controller.port-system-property=cpgame.demo.port
controller.port-environment=CPGAME_DEMO_PORT
controller.port-range=50000-59999
controller.publish-argument=--publish
demo.mode=managed-process
demo.publish-directory=../../../publish/2290-Samba-Sensation
demo.entry-file=index.html
