# Platform Controller contract v3; the host must inject a port from 50000-59999.
controller.contract-version=3
controller.jar=dist/controller.jar
controller.main-class=com.cpgame.luckynightmarket.ControllerMain
main-class=com.cpgame.luckynightmarket.ControllerMain
controller.config=dist/demo-controller.properties
controller.config-optional=false
controller.config-argument=--config
controller.process-mode=managed-process
demo.mode=managed-process
controller.port-argument=--port
controller.port-environment=PORT
controller.port-range=50000-59999
controller.dynamic-port=true
controller.port-source=platform
controller.port-property=server.port
controller.publish-argument=--publish
controller.bind-argument=--bind
controller.bind-address=0.0.0.0
server.bind=0.0.0.0
# The platform passes --publish. This relative fallback is for the root configuration location.
publish.directory=../../publish/2470-Lucky-Night-Market
publish.dir=../../publish/2470-Lucky-Night-Market
demo.publish-directory=../../publish/2470-Lucky-Night-Market
demo.entry-file=index.html
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.game-id=8002470
redis.password=
demo.starting-balance=100000.00
# Demo-only weighted random draws, with short-session deficit weights (no fixed sequence).
# Each paid round first draws win/loss. Targets: 40% loss, 40% ordinary, 10% wheel, 10% feature.
# A Feature is ONE paid round; its eight response steps retain the SAME Redis member.
# Winning modes have conditional target shares 4:1:1 (ordinary:wheel:feature).
# These settings never change formal generation weights, payouts, or Redis members.
demo.win-probability=0.60
# Of ordinary wins, 90% select an existing bucket below 5x the TOTAL five-line bet.
# Redis bucket units are b*l: units 1..24 are small; units >=25 remain reachable.
# A bucket is random within its selected band, then a valid Redis member is random within it.
demo.ordinary-small-win-probability=0.90
redis.username=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
