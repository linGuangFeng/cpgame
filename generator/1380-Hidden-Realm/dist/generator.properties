# Hidden Realm 1380 Redis loader. Runtime entropy is SecureRandom, not configurable.
# Weights: reports/1380-Hidden-Realm/dealing-model.json (695 training true paid rounds).
# paid_initial 17375: 1=2120 2=2073 3=2150 4=2077 5=2102 6=2089 7=2180 8=2204 9=380
# cascade_refill 2260: 1=284 2=252 3=265 4=224 5=264 6=282 7=277 8=308 9=104
# feature_refill 7280: 1=791 2=900 3=886 4=921 5=865 6=915 7=878 8=931 9=193
# lord_transform 1932: 5=486 6=465 7=480 8=501 (wild never observed)
# caps: initial wild col<=3 page<=5; any page wild col<=3 page<=6
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.ssl=false
redis.username=
redis.password=
redis.game-id=8001380
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=25（只计能中奖格子），中奖线数=10。 倍数单位默认 1。
# 普通最小 1，特殊最小 50（5×中奖线数）。普通最大 750（75×10），特殊最大 1000（100×10）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.loss-count=100000000
generation.win-count=100000000
generation.special-count=100000000
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=750
generation.special-min-win-multiplier=50
generation.special-max-win-multiplier=1000
