# Lucky Wheel 43 正式 Redis Loader 配置
# 本地复刻权重来自真实完整Round样本，不代表原厂长期概率或RTP。
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8000043
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=3（只计能中奖格子），中奖线数=1。 倍数单位默认 1。
# 普通最小 1，特殊最小 5（5×中奖线数）。出奖位置不足九宫，不限制最大倍数。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=100
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=5
generation.max-consecutive-wins=2
generation.normal-max-win-multiplier=1000000
generation.special-max-win-multiplier=1000000

# bet<5：4532个训练Round（另468个SHA-256留出Round不参与）。
generation.outcome.bet-lt5.ordinary-loss.weight=3442
generation.outcome.bet-lt5.ordinary-win.weight=199
generation.outcome.bet-lt5.multiplier-md1.weight=815
generation.outcome.bet-lt5.respin-md2.weight=76
# bet>=5：100个定向Round中的57个训练分区；MD3只在本档案。
generation.outcome.bet-gte5.ordinary-loss.weight=45
generation.outcome.bet-gte5.ordinary-win.weight=2
generation.outcome.bet-gte5.multiplier-md1.weight=7
generation.outcome.bet-gte5.respin-md2.weight=1
generation.outcome.bet-gte5.scatter-lucky-wheel-md3.weight=2

