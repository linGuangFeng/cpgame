# 总次数是候选完整局尝试数；默认一亿。每批 1000 次使用同一权重相位，失败候选计数且不补足。
generation.count=100000000
generation.batch-size=1000

# 倍率范围直接填写要写入 Redis 的整数缓存倍率，不再做二次换算。
# 赔表0.25倍由核心算成缓存倍率25。0倍不是全局特例，仅在当前玩法范围包含0时进入0桶。
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=25000
generation.free-min-win-multiplier=500
generation.free-max-win-multiplier=30000

# 保持原有缓存映射：普通完整局用 Per/BetLog 类型0，免费完整局用 MaryKeyList/MaryLog 类型0，前缀均为008000060。
# 容量继承顺序：具体倍率桶 > 玩法类型 > 家族默认。未配置覆盖时普通每桶300，Mary默认50。
retention.normal-per-multiplier=300
retention.mary-per-multiplier=50

# 基础权重来源：原站连续抓取中已完成的964局、1394个Step；按 nfsc=0 统计付费阶段961屏，nfsc>0统计免费阶段433屏。
