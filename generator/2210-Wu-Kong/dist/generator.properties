# 2210 Wu Kong 正式 Redis Loader。只使用 SecureRandom；无 seed、倍率追逐或本地输出。
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8002210
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=2（只计能中奖格子），中奖线数=1。倍数单位默认 1。
# 普通最小 1，特殊最小 5（5×中奖线数）。出奖位置不足九宫，不限制最大倍数。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 最多生成目标；每个实际倍率 Key 最终由 LTRIM 保留最多 300 条。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=50
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=5
generation.max-consecutive-wins=10
generation.normal-max-win-multiplier=1000000
generation.special-max-win-multiplier=1000000

# 当前游戏直接牌面值的正数支持权重。初始入口共 2000 个位置：空1538、0为201、1为51、5为129、10为81。
# 来源：原厂完整 Round 训练集 records 1-1000；仅作本地复刻校准，不代表原厂长期概率或 RTP。
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.initial.blank=1538
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.initial.zero=201
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.initial.one=51
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.initial.five=129
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.initial.ten=81
# RESPIN 整盘重发入口共 56 个新位置：0为8、1为10、5为21、10为17；来源同上。
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.respin-redeal.zero=8
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.respin-redeal.one=10
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.respin-redeal.five=21
# UNSUPPORTED (fixed joint model; use documented joint weights): generation.symbol.respin-redeal.ten=17

# 初始入口：1000 Round / 2000 positions。NONE 804/1000≈80.4%，X2 75≈7.5%，X5 93≈9.3%，RESPIN 28≈2.8%。
weights.mode=NONE:804|X2:75|X5:93|RESPIN:28
# 初始 NONE：804 个完整有序两位联合状态；来源原厂 Round 1-1000。
weights.initial.none=null,null:621|null,0:132|10,1:12|10,0:11|10,5:10|5,0:10|5,1:5|5,5:3
# 初始 X2：75 个完整联合状态；24/75 为真实 0 倍特殊状态。
weights.initial.x2=null,null:24|10,5:14|10,0:13|10,1:8|5,5:8|5,1:7|5,0:1
# 初始 X5：93 个完整联合状态；34/93 为真实 0 倍特殊状态。
weights.initial.x5=null,null:34|5,5:13|10,0:12|5,0:11|1,5:8|5,1:8|null,0:6|10,null:1
# RESPIN 初始入口：28 Round 的完整联合状态。
weights.initial.respin=null,null:15|null,0:5|null,1:3|5,5:2|null,5:2|5,null:1
# RESPIN 新发入口：28 Round / 56 新位置；整组两位重转，保留位置为 0。
weights.respin-redeal=10,1:9|10,5:5|5,0:5|5,5:5|10,0:3|5,1:1
# 上述样本估计不代表原厂长期概率或 RTP；生成分布另以 10000 局独立检验。
