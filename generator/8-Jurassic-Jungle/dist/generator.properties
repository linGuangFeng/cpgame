# Jurassic-Jungle（原游戏 8）：完整局生成器；修改此文件后重新运行同目录 .cmd 生效。
# 配置只控制自然候选的采样及筛选，不修改实际派奖或强凑目标倍数。

# 一、Redis 连接：保留当前连接参数；database 为 Redis 逻辑库编号。
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000

# 二、游戏 ID 与 Key：raw-id 是规则 ID；redis.game-id 是当前部署的缓存 ID。
# 本模块缓存 ID 固定为 8000008，必须与消费端一致。
game.raw-id=8
redis.game-id=8000008
# 普通：PerKeyList_%09d / BetLog:0%08d:%06d；特殊：MaryKeyList_%09d / MaryLog:%09d:%06d。
# 每批执行 MULTI/EXEC，逐条 ZADD + RPUSH + LTRIM，保留最近的牌面。
# 兼容现有游戏8消费端：Key 整数档位为实际总投注倍率×10；以下筛选范围统一使用实际总投注倍率。

# 三、全部模式（逗号分隔；填写多个时在启用模式中随机选择）：
# LOSS=普通零奖完整局，写入普通奖 PerKeyList。
# WIN=普通中奖，含未到巨龙的土龙/水龙/火龙完整局，写入普通奖 PerKeyList。
# DRAGON=变成巨龙（remove_status=4）的完整局，写入玛丽奖 MaryKeyList。
# 土龙/水龙/火龙/巨龙仍在同一局内按收集器顺序触发，不能拆成独立局；
# 只有达到巨龙的完整局进玛丽奖，其余奖励都进普通奖。
# 默认同时生成全部三类。关闭某类时从下面列表移除对应名称。
generation.modes=LOSS,WIN,DRAGON

# 四、生成数量：本次成功写入的完整局总数；不是最终 Redis 中保留的条数。
generation.total-members=100000000
# 如需分别控制普通/特殊数量，同时启用下列两项；两项合计必须等于 total-members。
# generation.normal-count=50000000
# generation.special-count=50000000
# 候选上限：范围筛选/非整数淘汰也计入；用尽后报告实际完成数，不冒充成功。
generation.max-candidates=100000000
# 每批写入多少个已复核完整局，范围 1..10000；末批不足时也提交。
generation.batch-size=1000

# 五、每倍率保留数量：普通/特殊分别 LTRIM，不限制本次写入总数。
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50

# 六、倍率筛选：单位为总派奖/本局总投注，包含边界；本游戏底注线数=10。
# 普通范围包含0以写入 LOSS；若将最小值设为正数，则不写 LOSS，须同步关闭该模式/普通数量。
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=5000
generation.special-min-win-multiplier=50
generation.special-max-win-multiplier=5000
# 所有模式共用的整局安全上限；与分池上限同时生效，超过时丢弃候选。
generation.maximum-round-multiplier=3000

# 七、连消/特殊流程上限：超过时丢弃整个候选，不截断结算。
# 全局最大 Step 数，含付费首盘、连消结束盘及各龙奖励页；证据上限47。无Scatter免费次数配置。
generation.maximum-steps=47

# 八、建模投注档：当前已验证 Loader 固定 bet-size=0.05；bet-level 1..10。
generation.bet-size=0.05
generation.bet-level=1

# 九、牌面权重：训练列块中的实际符号格计数；普通分母44336，特殊分母37950。
# 按整列块抽样；代码用“配置计数/原始计数”调整整列块权重，不是逐格独立随机。
# 调整权重仍受符号位置/数量上限约束；零奖入口另施加真实不中奖约束。
# normal=付费首盘及基础连消补牌；special=各龙补牌。火龙覆盖和巨龙变牌仍用已验证转换权重。
# S1=Wild；S2..S9=普通付费符号。数据源：jj8-column-model.tsv（1514个训练完整局）。
generation.symbol.S1.normal-weight=834
generation.symbol.S1.special-weight=694
generation.symbol.S2.normal-weight=5489
generation.symbol.S2.special-weight=7052
generation.symbol.S3.normal-weight=5606
generation.symbol.S3.special-weight=6764
generation.symbol.S4.normal-weight=5358
generation.symbol.S4.special-weight=6631
generation.symbol.S5.normal-weight=5412
generation.symbol.S5.special-weight=6758
generation.symbol.S6.normal-weight=5378
generation.symbol.S6.special-weight=2441
generation.symbol.S7.normal-weight=5504
generation.symbol.S7.special-weight=2635
generation.symbol.S8.normal-weight=5360
generation.symbol.S8.special-weight=2507
generation.symbol.S9.normal-weight=5395
generation.symbol.S9.special-weight=2468
