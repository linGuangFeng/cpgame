# 示例配置；后台实际运行和保存配置使用 dist/generator.properties。
# Monster Slayer 2300：完整局生成并写入 Redis db=15
# 运行前 Redis 必须已在 redis.host:redis.port 监听。连不上会直接失败。
# 键名与 1809 对齐；盘面是本游戏 5×3、符号 1..10 + Scatter 100，禁止抄 1809 的 30 格/1..13。

# Redis 连接
redis.host=127.0.0.1
redis.port=6379
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8002300
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=20。 Redis 存百分之一倍（100=1x）。
# 普通最小 100，特殊最小 10000（5×中奖线数）。普通最大 150000（75×20），特殊最大 200000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：普通空奖、普通中奖、三种购买模式。自然特殊局尚未实现，不提供生成配置。
generation.loss-count=100000000
generation.win-count=100000000
generation.buy-count-per-mode=100000000
generation.batch-size=50
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100

# 单个完整局连赢/猎杀步数上限（购买模板已是完整链；普通局只有一页）
generation.max-consecutive-wins=10
generation.max-mary-spins=32

# Redis 倍率是百分之一倍（100=1x）。本游戏 3 连赔付可低于 1x，所以下限是 1 centi。
generation.normal-min-win-multiplier=100
generation.normal-max-win-multiplier=150000
generation.mary-min-win-multiplier=1
generation.mary-max-win-multiplier=200000
generation.max-centi-multiplier=200000

# UNSUPPORTED: natural feature unavailable; buy rounds use bundled complete templates. generation.special-trigger-weight-multiplier=10

# 牌面权重：实际概率 = 当前牌权重 / 当前模式全部权重总和。逐格独立抽样。
# 来源 1237 个自然付费第一页（排除 100 个 holdout 完整局），每页 15 格，合计 18555 格。
# 这是样本计数，不宣称等于原厂长期概率或 RTP。
# ID 1；普通 2701/18555≈14.556%
generation.symbol.1.normal-weight=2701
# UNSUPPORTED: natural feature unavailable; buy rounds use bundled complete templates. generation.symbol.1.mary-weight=2701
# ID 2；普通 2042/18555≈11.005%
generation.symbol.2.normal-weight=2042
