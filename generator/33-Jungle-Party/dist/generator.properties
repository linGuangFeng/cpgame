# Multiplier unit: integer (betSize × betLevel). Payline count is NOT in the divisor.
# Jungle Party（raw gid 33）正式完整 Round 生成器配置
# 一、Redis 连接：保留当前连接参数；database 为 Redis 逻辑库编号。
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000

redis.game-id=8000033
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=25（只影响扣费 paidBet，不进倍数分母）。
# Redis 与配置同一单位：奖金/(betSize×betLevel) 的整数倍。例如单线赔 5 → 倍数 5；25 线满注 1 倍总押=25。
# 抓包 WIN 核全是大约 50 倍总押以上，普通小倍（5/10/25/50…）由规则构造，不从该核抽样。
# 普通最小 1，特殊最小/最大按整数倍配置；改单位后请清空旧 Redis 桶再重生成。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=25

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50
generation.max-consecutive-wins=8

# 倍数范围：正倍完整局低于最小或超过最大则丢弃；0 倍走 0 桶，不套最小倍数
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=12500
generation.special-min-win-multiplier=125
generation.special-max-win-multiplier=12500

# 牌面权重是 generation-model-v37.tsv 训练联合盘中的实际格数。
