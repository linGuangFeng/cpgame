# Multiplier unit: hundredths of total paid bet return (100 = 1x).
# Jungle Party（raw gid 33）正式完整 Round 生成器配置
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8000033
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=25。 Redis 倍率单位为百分之一倍（100=1倍），范围配置使用同一单位。
# 普通最小 1，特殊最小 125（5×中奖线数）。普通最大 1875（75×25），特殊最大 2500（100×25）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=25
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=125
generation.max-consecutive-wins=8
generation.normal-max-win-multiplier=1875
generation.special-max-win-multiplier=2500
# Audit-calibration weights; the authoritative runtime sampler is the provider-trained joint kernel.
# 固定联合模型，不接受此旧字段：generation.symbol.9.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.A.weight=95
# 固定联合模型，不接受此旧字段：generation.symbol.H1.weight=55
# 固定联合模型，不接受此旧字段：generation.symbol.H2.weight=60
# 固定联合模型，不接受此旧字段：generation.symbol.H3.weight=70
# 固定联合模型，不接受此旧字段：generation.symbol.H4.weight=75
# 固定联合模型，不接受此旧字段：generation.symbol.H5.weight=75
# 固定联合模型，不接受此旧字段：generation.symbol.J.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.K.weight=95
# 固定联合模型，不接受此旧字段：generation.symbol.Q.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.T.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.Wild.weight=15
