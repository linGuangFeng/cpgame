# Redis 固定交付目标。连接失败时只检查网络和配置，不改变规则，也不退化为本地输出。
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000
redis.game-id=8002410
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d。
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏 9 格、5 条线。配置倍率沿用 Redis 内部赔率单位；除以 5 为总投注倍数。
# 当前采用穷举覆盖灌库：普通穷举 6^9 张直出牌面；锁列按合法结构构造；满屏按可达倍率构造。
# 只处理下方最小／最大范围内的可达倍率；每档达到保留数量即停止，不按总局数反复生成。
# 普通池写入直出与锁列重转；满屏奖（直接满屏、重转满屏）写入玛丽池。
# 普通池按 generation.respin-share 控制非满屏中奖里锁列的目标占比；试玩向下取桶后大约是这个比例。
# 玛丽池按 generation.mary-respin-share 控制锁列占玛丽奖的比例，默认与 respin-share 相同。
# 此策略用于覆盖缓存，不代表原厂自然出奖概率或 RTP。

# 【已停用：总生成次数】穷举按倍率桶容量自动结束，不需要配置；旧数字仅注释留档。
# generation.normal-count=100000000
# generation.special-count=100000000
# 每次提交 Redis 的批次数量，仍然生效，仅影响写入批次，不决定总生成局数。
generation.batch-size=100

# 【牌面数量】每个倍率桶最多保留的完整局数量；也是本次穷举每档的生成目标。
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50
# 【完整局上限】仍参与约束构造，不能注释；同时受原规则及已观测阶段上限约束。
generation.max-consecutive-wins=10
generation.mode.MULTIPLIER_STICKY.max-spins=30

# 【倍数范围】最小／最大均保留且生效，只生成范围内可达的倍率档；不改变已有数字。
# 0 倍也受范围约束，仅当普通最小值为 0 时生成零倍桶。
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=25
generation.normal-max-total-multiplier=2500
generation.special-max-total-multiplier=2500

# 【锁列占比】灌库时可改，试玩按倍率向下取桶后大约落到这个比例。两个键都是 0~1。
# 普通池非满屏中奖里锁列重转的目标占比，其余为直出。默认 0.19 保持当前非满屏锁列比例。
generation.respin-share=0.19
# 玛丽奖里锁列重转的目标占比，其余为满屏。默认与上一项相同（0.19）。0 则玛丽只有满屏。
generation.mary-respin-share=0.19

# 【已停用：模式权重】特殊模式按可达倍率结构枚举覆盖，不按概率选择；旧数字仅留档。
# 以下模式／符号／材质权重均不参与正式穷举 Loader，即使取消注释也不会影响灌库。
# generation.mode.RESPIN_UNTIL_WIN.weight=71
# generation.mode.MULTIPLIER_STICKY.weight=12

