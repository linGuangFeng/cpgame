# Redis 固定交付目标。连接失败时只检查网络和配置，不改变规则，也不退化为本地输出。
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.ssl=false
redis.username=
redis.password=
redis.game-id=8002410
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=9（只计能中奖格子），中奖线数=5。 倍数单位默认 1。
# 普通最小 1，特殊最小 25（5×中奖线数）。普通最大 375（75×5），特殊最大 500（100×5）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 本次进程最多生成的完整局数量；Redis 最终容量由每个实际倍率桶的上限控制。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=100
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=25
generation.max-consecutive-wins=10
generation.normal-max-total-multiplier=375
generation.special-max-total-multiplier=500
generation.mode.MULTIPLIER_STICKY.max-spins=30
# 特殊模式选择权重：真实 provider 样本 83 局中 Respin 71 局、Multiplier 12 局。
# 仅作为本地复刻相对权重，不代表原厂长期概率或 RTP。
generation.mode.RESPIN_UNTIL_WIN.weight=71
generation.mode.MULTIPLIER_STICKY.weight=12

# INITIAL：训练集 420 局、3780 格。2=591(15.63%)，3=598(15.82%)，5=565(14.95%)，
# 10=553(14.63%)，20=558(14.76%)，50=915(24.21%)。
# 来源：captures/2410-Electro-Fiesta/analysis/sample-analysis.json。
# 这些是本地复刻相对权重，不代表原厂长期概率或 RTP。
generation.symbol.initial.2=591
generation.symbol.initial.3=598
generation.symbol.initial.5=565
generation.symbol.initial.10=553
generation.symbol.initial.20=558
generation.symbol.initial.50=915

# RESPIN_REEL：57 局、567 个相邻差分新格。2=69(12.17%)，3=77(13.58%)，
# 5=102(17.99%)，10=92(16.23%)，20=112(19.75%)，50=115(20.28%)。
# 来源：captures/2410-Electro-Fiesta/analysis/sample-analysis.json。
generation.symbol.respin-reel.2=69
generation.symbol.respin-reel.3=77
generation.symbol.respin-reel.5=102
generation.symbol.respin-reel.10=92
generation.symbol.respin-reel.20=112
generation.symbol.respin-reel.50=115

# MULTIPLIER_STICKY_ADDITION：7 局、39 个新增位置。
# 2=11(28.21%)，3=8(20.51%)，5=11(28.21%)，10=9(23.08%)。
# 来源：captures/2410-Electro-Fiesta/analysis/sample-analysis.json。
generation.material.multiplier.2=11
generation.material.multiplier.3=8
generation.material.multiplier.5=11
generation.material.multiplier.10=9

# 所有直接发牌符号硬上限：每列 3、整盘 9；倍率材质每列 3、整盘 9。权重不替代上限。
