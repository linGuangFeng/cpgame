# 测试与正式 dist 共用相同键结构；数量仅在测试中覆盖。
redis.host=54.172.218.28
redis.port=8016
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000
redis.database=0
redis.game-id=8002350
# 生成次数按候选局尝试数计算；失败候选不补足。最后不足一批时按实际剩余次数执行。
generation.count=100000000
generation.batch-size=1000

# 每个倍率桶保留最新 N 个完整局；普通 Per 0 容量 300，两种 Mary 各继承容量 50。
retention.normal-per-multiplier=300
retention.mary-per-multiplier=50

# Redis 整数倍率单位：索引整数 = 实际总押注倍数 × 25。0 倍也写完整牌面。
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=7000
generation.mary-min-win-multiplier=0
generation.mary-max-win-multiplier=250000

# 统一总尝试数内的独立场景抽样权重；先选场景再自然生成，不是按目标奖金造局。
generation.scene.normal-weight=8
generation.scene.free-expanding-wild-weight=1
generation.scene.hold-and-spins-weight=1

# Hold 每个空位独立抽取“空/落 Coin”的临时工程权重；Coin 面值按已确认的 1..10 均匀抽取。
# 没有原站概率证据，不能称为官方概率或 RTP。
generation.hold.empty-weight=9
generation.hold.coin-weight=1

# 基础权重来源：10 个连续原站付费局共 150 格的合并计数；样本小且按结果停止，存在偏差，非官方 RTP。
weights.source=captures/2350-Curupira/paid-rounds，10局150格，SAMPLE_INSUFFICIENT
# 批次循环：基础权重 -> 依次只放大一张牌 -> 回到基础权重。
weights.order=1,2,3,4,11,12,13,14,21,31
