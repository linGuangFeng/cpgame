# 以下是当前游戏专属的本地复刻权重，可调整并由规则/分布测试复核；不代表原厂 RTP。

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=pssss@6j&NHIjpB
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8002350
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=25。 倍数单位默认 1。
# 普通最小 1，特殊最小 125（5×中奖线数）。普通最大 1875（75×25），特殊最大 2500（100×25）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 每个 member 是一局完整 Round；未中奖写入 BetLog:000002350:000000
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=10

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50
generation.max-consecutive-wins=10
generation.max-special-steps=30

# 倍数范围：正倍完整局低于最小或超过最大则丢弃；0 倍走 0 桶，不套最小倍数
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=7000
generation.special-min-win-multiplier=125
generation.special-max-win-multiplier=7500

# 完整局倍率下限（闭区间）；普通 1、特殊 125=5×25，下限大于 0 时不写入零倍。

# 构造式独立未中奖验证
generation.loss.construction-attempts=5
generation.loss.fallback-samples=10
generation.loss.validation-samples=100000
generation.loss.minimum-first-success-rate=0.90

# 当前游戏本地复刻牌面权重（符号 21=Wild，31=Scatter）
generation.symbol.1.normal-weight=8
generation.symbol.2.normal-weight=9
generation.symbol.3.normal-weight=10
generation.symbol.4.normal-weight=11
