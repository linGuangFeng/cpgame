# Redis 连接配置（仅写入独立生成结果）
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
# 游戏与批量生成配置
redis.game-id=8001810
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=10（只计能中奖格子），中奖线数=10。 倍数单位默认 1。
# 普通最小 1，特殊最小 50（5×中奖线数）。普通最大 750（75×10），特殊最大 1000（100×10）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=500
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.normal-min-win-multiplier=1
generation.special-min-win-multiplier=50
generation.max-consecutive-wins=4
generation.normal-max-win-multiplier=750
generation.special-max-win-multiplier=1000
generation.normal-loss-ratio=0.872
generation.treasure-hunt-ratio=0.824
# 符号基础正权重；整盘生成还会叠加位置与相邻转移联合模型
# 固定联合模型，不接受此旧字段：generation.symbol.1.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.2.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.3.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.4.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.5.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.6.weight=100
# 固定联合模型，不接受此旧字段：generation.symbol.7.weight=15
