# Beach Fun 1940：完整局直接生成并批量写入 Redis
# 运行前 Redis 必须已在 redis.host:redis.port 监听。连不上会直接失败。
# 牌面出法仍用 beachfun-distribution.tsv 的联合列/金框模型（captures/1940-Beach-Fun/round-batches.jsonl 训练 1765 局）。
# 下面 symbol 权重是原站第一页格子计数，供实验室对照和特殊入口 Scatter 加权；不宣称等于原厂 RTP。
# 正式 Redis 使用系统安全随机源，禁止 seed。

# Redis 连接
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID（PerKeyList_000001940 / BetLog:000001940:%06d / MaryKeyList / MaryLog）
redis.game-id=8001940
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=20（只计能中奖格子），中奖线数=20。 倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：每个 member 都是一局从付费开始到所有连消/免费局结束的完整局
# 普通/特殊是两个随机开局入口，每 generation.entry-switch-every 次（含丢弃）换入口
# 特殊入口只把开局 Scatter 权重按下面 mary/normal 比值加权（符号 9）
generation.normal-count=100000000
generation.special-count=100000000
# 每生成多少局，用一个 Redis MULTI/EXEC 事务写入一次
generation.batch-size=100

# 本次启动时，普通/特殊奖池中每个实际倍率最多生成多少局；Redis 每个倍率 Key 只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.special-min-win-multiplier=100
generation.special-max-win-multiplier=2000

# 单个 Spin 最大连续中奖/连消次数（不含终止空页）；超过则整局丢弃
# 训练模型 paidSteps=14
generation.max-consecutive-wins=14

# 一个完整 Round 中免费 Spin 的累计上限（含 Scatter 追加）；超过则整局丢弃
# 训练模型 deliveriesPerRound=15
generation.max-mary-spins=15

# 普通/特殊入口切换周期（含丢弃的候选）
generation.entry-switch-every=1000

# 自然生成完整局的累计中奖倍数范围；0 倍普通局写入 BetLog:000001940:000000，不走此范围
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=1500
generation.mary-min-win-multiplier=100
generation.mary-max-win-multiplier=2000

# 牌面权重：实际概率 = 当前牌权重 / 当前模式全部可开局符号权重总和
# 普通：1865 个自然付费起点第一页，5×4=20 格，合计 37300 格（不含连消续页）。
# 玛丽：650 个免费 Spin 第一页（type=2，不含连消续页），合计 13000 格。
# ID 1；普通 4513/37300≈12.099196%；玛丽 1651/13000≈12.700000%
generation.symbol.1.normal-weight=4513
generation.symbol.1.mary-weight=1651
# ID 2；普通 4568/37300≈12.246649%；玛丽 1577/13000≈12.130769%
generation.symbol.2.normal-weight=4568
generation.symbol.2.mary-weight=1577
# ID 3；普通 4608/37300≈12.353887%；玛丽 1545/13000≈11.884615%
generation.symbol.3.normal-weight=4608
generation.symbol.3.mary-weight=1545
# ID 4；普通 4569/37300≈12.249330%；玛丽 1577/13000≈12.130769%
generation.symbol.4.normal-weight=4569
generation.symbol.4.mary-weight=1577
# ID 5；普通 4559/37300≈12.222520%；玛丽 1608/13000≈12.369231%
generation.symbol.5.normal-weight=4559
generation.symbol.5.mary-weight=1608
# ID 6；普通 4442/37300≈11.908847%；玛丽 1596/13000≈12.276923%
generation.symbol.6.normal-weight=4442
generation.symbol.6.mary-weight=1596
# ID 7；普通 4640/37300≈12.439678%；玛丽 1591/13000≈12.238462%
generation.symbol.7.normal-weight=4640
generation.symbol.7.mary-weight=1591
# ID 8；普通 4677/37300≈12.538874%；玛丽 1596/13000≈12.276923%
generation.symbol.8.normal-weight=4677
generation.symbol.8.mary-weight=1596
# ID 9 = Scatter；普通 724/37300≈1.941019%；玛丽 259/13000≈1.992308%
generation.symbol.9.normal-weight=724
generation.symbol.9.mary-weight=259
# ID 10 = Wild；开局第一页 0/37300 与 0/13000。Wild 只由 2/3/4 轴金框中奖后转换产生，禁止当开局符号。
generation.symbol.10.normal-weight=0
generation.symbol.10.mary-weight=0
