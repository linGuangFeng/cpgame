# 1. Redis connection. All paid and nonwinning complete rounds go to this database.
redis.host=18.234.101.161
redis.port=8021
redis.database=0
redis.password=pssss@6j&NHIjpB

# 2. Game ID and exact betLog index/list convention. Integer units are b*l; total bet is 5 units.
# PerKeyList_000002470 -> BetLog:000002470:%06d, MaryKeyList_000002470 -> MaryLog:000002470:%06d.
# Every member uses LNM1 ASCII facts; each batch issues ZADD + RPUSH + LTRIM transactionally.
redis.game-id=8002470

# 3. Complete round generation count. Mode frequencies use the 2900-round training split.
generation.count=10000
# Number of complete rounds committed per Redis transaction; controls memory/transaction size.
generation.batch-size=100
# Maximum rejection attempts; exhausted support raises an error, never loops indefinitely.
generation.attempt-limit=100000

# 4. Retain the most recently generated members of each integer payout bucket.
# Normal includes the zero-payout loss bucket. Special retention cannot exceed 100.
retention.normal-per-multiplier=300
retention.special-per-multiplier=100

# 5. Lucky Feature has exactly eight independent deliveries (start st=7 through st=0).
# No cascading/retriggering entry exists. The fitted cap also limits observed win counts to 1..6.
generation.feature-steps=8

# 6. Payout limits in b*l units (five actual paylines, not ways).
# Normal minimum 1, maximum 75*5=375; losses are separately retained at integer zero.
range.normal-min=1
range.normal-max=375
# Special minimum 5*5=25, maximum 100*5=500, applied to the complete paid round.
# The observed 200x wheel exceeds the default range and is rejected, not clipped.
range.special-min=25
range.special-max=500

# 7. Dealing weights. Embedded model stores aggregate three-symbol reel-vector and adjacent
# reel transition counts by real entry and payout band, with joint three-slot multiplier counts.
# It contains no provider responses, full boards or complete rounds. 100 holdout rounds excluded.
# Probability of backing off an adjacent-reel conditional to that reel's fitted marginal.
# Wheel has only two source samples: it always uses entry-wide three-symbol reel marginals,
# preserving each reel vector and all caps while avoiding one-board-per-prize replay.
model.column-backoff-probability=0.15
# Multipliers below scale the observed mode frequencies (2353/430/2/115 out of 2900).
# Ordinary entry vectors/transitions and joint multipliers are sampled before rule classification.
# The lowest captured payout is descriptive, not a rule minimum; pool ranges above apply.
# These are formal generation weights; Demo's approximately balanced selection is configured
# ONLY in demo-controller.properties and cannot change this Loader or its fitted symbol caps.
mode.weight.ORDINARY_LOSS=1
mode.weight.ORDINARY_WIN=1
mode.weight.LUCKY_WHEEL=1
mode.weight.LUCKY_FEATURE=1
redis.username=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
