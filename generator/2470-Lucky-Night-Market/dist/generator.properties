# 1. 缓存连接：所有付费完整局和未中奖完整局都写入此数据库。
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000
# 游戏编号固定为 8002470；普通写入 0 开头普通索引，转盘写入 1 开头普通索引，幸运特色写入 0 开头特殊索引。
# 每条结果使用紧凑文本编码；每批结束后把本批已有的全部有效结果以事务方式写入，不要求单个缓存凑满 100 条。
redis.game-id=8002470

# 2. 生成数量与批次：生成总尝试数；场景频率以 2900 局采集统计作为随机权重参考。
generation.count=100000000
# 每批最多生成 100 局。批次结束就写入本批各缓存已有的有效结果，不按单个倍率桶等待凑满。
generation.batch-size=100
# 旧版单次重试上限兼容项；新版每次只生成一个候选，失败直接丢弃，不在本次尝试内补抽。
generation.attempt-limit=100000000
# 3. 每个整数倍率桶保留的最新结果条数；普通和转盘读取普通容量，玛丽读取特殊容量。
retention.normal-per-multiplier=300
retention.special-per-multiplier=50

# 4. 幸运特色固定生成 8 个独立步骤（状态从 7 到 0），没有连消或再次触发；不使用样本中奖步数限制生成范围。
generation.feature-steps=8

# 5. 倍数范围：单位为下注基数乘等级，本游戏按 5 条真实中奖线计算，不按连线组合数计算。
# 普通完整局的最小和最大中奖倍数；0 倍未中奖结果单独保存在普通池。
range.normal-min=1
range.normal-max=2500
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=2500
# 特殊完整局的最小和最大中奖倍数，范围作用于整局结果。
range.special-min=25
range.special-max=2500
generation.special-min-win-multiplier=25
generation.special-max-win-multiplier=2500

# 6. 牌面权重：以下基础权重来自 3705 个采集步骤、33345 个牌位的实际出现次数，只作为逐牌随机概率。
# 每个牌位直接按当前权重随机，再由真实中奖线和模式规则结算；不会从样本整列、整盘、中奖组合或倍率三元组中抽取候选，也不把样本极值当规则上限。
# 第一批全部使用基础权重；后续批次依次只强化百搭牌、高牌一、高牌二、低牌一、低牌二、低牌三、低牌四；全部轮询后回到基础权重批次再循环。
# 每张牌拥有独立强化倍数；强化时使用“该牌样本基础权重乘以对应强化倍数”，不是把权重直接改成 3。
symbol.weight.WILD=1769
symbol.weight.WILD_boost_mul=3
symbol.weight.H1=676
symbol.weight.H1_boost_mul=15
symbol.weight.H2=6774
symbol.weight.H2_boost_mul=3
symbol.weight.L1=6179
symbol.weight.L1_boost_mul=3
symbol.weight.L2=5937
symbol.weight.L2_boost_mul=3
symbol.weight.L3=5932
symbol.weight.L3_boost_mul=3
symbol.weight.L4=6078
symbol.weight.L4_boost_mul=3
# 旧版列模型兼容字段；新规则生成器不再使用样本列模型限制牌面。
model.column-backoff-probability=0.15
# 7. 场景权重：普通输赢两项只共同缩放“普通场景”的采集频率；普通最终输赢必须由随机牌面结算后自然分类，不能预先指定。
# 幸运转盘和幸运特色分别缩放对应场景；这些值只影响缓存生成，不影响试玩选择配置。
mode.weight.ORDINARY_LOSS=1
mode.weight.ORDINARY_WIN=1
mode.weight.LUCKY_WHEEL=1
mode.weight.LUCKY_FEATURE=1
