# Redis multiplier = award/(betSize×betLevel); old buckets used /paidBet (=×20 lines). Limits scaled ×20 after unit fix. Clear Redis before regen.
# Jungle-Fruit（原游戏 16）：完整局生成器；修改此文件后重新运行同目录 .cmd 生效。
# 配置只控制自然候选的采样及筛选，不修改实际派奖或强凑目标倍数。

# 一、Redis 连接：保留当前连接参数；database 为 Redis 逻辑库编号。
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000

# 二、游戏 ID 与 Key：raw-id 是规则 ID；redis.game-id 是当前部署的缓存 ID。
# 本模块缓存 ID 固定为 8000016，必须与消费端一致。
game.raw-id=16
redis.game-id=8000016
# 普通：PerKeyList_%09d / BetLog:0%08d:%06d；特殊：MaryKeyList_%09d / MaryLog:%09d:%06d。
# 每批执行 MULTI/EXEC，逐条 ZADD + RPUSH + LTRIM，保留最近的牌面。
# Key 档位为实际总投注整数倍率；非整数候选丢弃，不取整派奖。

# 三、全部模式（逗号分隔；填写多个时在启用模式中随机选择）：
# LOSS=普通零奖，进普通池 BetLog；MARY=普通付费连消中奖，也进普通池 BetLog（本游戏的 MARY 只是 small_game_type=1 连消标签，不是平台玛丽玩法）。
# FREE=Scatter 免费完整局，进特殊池 MaryLog。WIN 仅为协议枚举，本生成器不支持。
generation.modes=LOSS,MARY,FREE

# 四、生成数量：本次成功写入的完整局总数；不是最终 Redis 中保留的条数。
generation.total-members=100000000
# 如需分别控制普通/特殊数量，同时启用下列两项；两项合计必须等于 total-members。
# generation.normal-count=50000000
# generation.special-count=50000000
# 候选上限：范围筛选/非整数淘汰也计入；用尽后报告实际完成数，不冒充成功。
generation.max-candidates=100000000
# 每批写入多少个已复核完整局，范围 1..10000；末批不足时也提交。
generation.batch-size=100

# 五、每倍率保留数量：普通/特殊分别 LTRIM，不限制本次写入总数。
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=30

# 六、倍率筛选：单位为总派奖/本局总投注，包含边界；本游戏底注线数=20。
# 普通范围包含0以写入 LOSS；若将最小值设为正数，则不写 LOSS，须同步关闭该模式/普通数量。
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=10000
generation.special-min-win-multiplier=100
generation.special-max-win-multiplier=10000
# 所有模式共用的整局安全上限；与分池上限同时生效，超过时丢弃候选。
generation.maximum-round-multiplier=2000

# 七、连消/特殊流程上限：超过时丢弃整个候选，不截断结算。
# 每个 Spin 最多连续中奖连消次数（1..18）；整局免费次数含追加（14..25）。
generation.maximum-cascades=18
generation.maximum-special-spins=25

# 八、建模投注档：当前已验证 Loader 固定 bet-size=0.05；bet-level 固定1。
generation.bet-size=0.05
generation.bet-level=1

# 九、牌面权重：训练列块中的实际符号格计数；普通分母45069，特殊分母19703。
# 按整列块抽样；代码用“配置计数/原始计数”调整整列块权重，不是逐格独立随机。
# 调整权重仍受符号位置/数量上限约束；零奖入口另施加真实不中奖约束。
# normal=PAID_LOSS/PAID_CASCADE/PAID_FREE首盘及BASE_REFILL；special=FREE_INITIAL/FREE_REFILL。
# H1..H5/A/K/Q/J/T=付费符号，Scat=免费触发，X*=倍率符号；数据源jf16-column-model.tsv。
generation.symbol.H1.normal-weight=4877
generation.symbol.H1.special-weight=2081
generation.symbol.H2.normal-weight=4585
generation.symbol.H2.special-weight=1889
