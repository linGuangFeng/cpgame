# Redis multiplier = award/(bet×level); was award/bet. Clear Redis before regen.
# 2060: bundled empirical column model, paid/free entry distributions.
# Full source counts and denominators: reports/2060-Club-Goddess/reel-distribution-model.json
# Production uses SecureRandom. Zero multiplier rounds are prewritten.
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8002060
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=30。 倍数单位默认 1。
# 普通最小 1，特殊最小 150（5×中奖线数）。普通最大 2250（75×30），特殊最大 3000（100×30）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=100

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
generation.max-consecutive-wins=10

# 倍数范围：正倍完整局低于最小或超过最大则丢弃；0 倍走 0 桶，不套最小倍数
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=2250
generation.special-min-win-multiplier=150
generation.special-max-win-multiplier=3000
