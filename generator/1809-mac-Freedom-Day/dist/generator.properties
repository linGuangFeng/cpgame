# Freedom Day 1809：完整局直接生成并批量写入 Redis
# 运行前 Redis 必须已在 redis.host:redis.port 监听。本机默认 127.0.0.1:6379，连不上会直接失败。

# Redis 连接
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID；默认来源游戏 ID 1809，可改成项目实际游戏 ID
redis.game-id=8001809
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=30（只计能中奖格子），中奖线数=20。 倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：每个 member 都是一局从付费开始到所有连消/免费局结束的完整局
generation.normal-count=100000000
generation.special-count=100000000

# 每生成多少局，用一个 Redis MULTI/EXEC 事务写入一次
generation.batch-size=100

# 本次启动时，普通/特殊奖池中每个实际倍率最多生成多少局；Redis 每个倍率 Key 只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=80

# 单个 Spin 最大连续中奖/连消次数；自然下一页仍中奖则丢弃整个候选 Round
generation.max-consecutive-wins=10

# 一个完整 Round 中玛丽免费 Spin 的累计上限（包含玛丽中 Scatter 追加次数）；超过则整局丢弃
generation.max-mary-spins=30

# 自然生成完整局的累计中奖倍数上限；超过后整局丢弃，不追逐或强改成上限
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=1500
generation.mary-min-win-multiplier=100
generation.mary-max-win-multiplier=2000

# 牌面权重：实际概率 = 当前牌权重 / 当前模式全部13种牌权重总和
# 来源 captures/1809-Freedom-Day/parallel-abc224 已保存完整局；这是样本计数，不宣称等于原厂长期概率或 RTP。
# 普通：1276 个自然付费起点（OFFICIAL_UI_ORDINARY + PROGRAMMATIC_ORDINARY，排除购买/摆牌），
# 每个起点只计第一页 30 格 prop + 4 格 trl，合计 43384 格。
# 玛丽：2330 个免费 Spin 第一页（不含连消续页），合计 79220 格。
# ID 1 = Ball；普通 466/43384≈1.074129%；玛丽 746/79220≈0.941681%
generation.symbol.1.normal-weight=466
generation.symbol.1.mary-weight=746
# ID 2；普通 4431/43384≈10.213443%；玛丽 7736/79220≈9.765211%
generation.symbol.2.normal-weight=4431
generation.symbol.2.mary-weight=7736
# ID 3；普通 4436/43384≈10.224968%；玛丽 7706/79220≈9.727342%
generation.symbol.3.normal-weight=4436
generation.symbol.3.mary-weight=7706
# ID 4；普通 4124/43384≈9.505809%；玛丽 7598/79220≈9.591012%
generation.symbol.4.normal-weight=4124
generation.symbol.4.mary-weight=7598
# ID 5；普通 4263/43384≈9.826203%；玛丽 7524/79220≈9.497602%
generation.symbol.5.normal-weight=4263
generation.symbol.5.mary-weight=7524
# ID 6；普通 4038/43384≈9.307579%；玛丽 7702/79220≈9.722292%
generation.symbol.6.normal-weight=4038
generation.symbol.6.mary-weight=7702
# ID 7；普通 4120/43384≈9.496589%；玛丽 7796/79220≈9.840949%
generation.symbol.7.normal-weight=4120
generation.symbol.7.mary-weight=7796
# ID 8；普通 4187/43384≈9.651023%；玛丽 7545/79220≈9.524110%
generation.symbol.8.normal-weight=4187
generation.symbol.8.mary-weight=7545
# ID 9；普通 4138/43384≈9.538079%；玛丽 7449/79220≈9.402929%
generation.symbol.9.normal-weight=4138
generation.symbol.9.mary-weight=7449
# ID 10；普通 4145/43384≈9.554214%；玛丽 7688/79220≈9.704620%
generation.symbol.10.normal-weight=4145
generation.symbol.10.mary-weight=7688
# ID 11；普通 4082/43384≈9.408999%；玛丽 7675/79220≈9.688210%
generation.symbol.11.normal-weight=4082
generation.symbol.11.mary-weight=7675
# ID 12 = Scatter；普通 754/43384≈1.737968%；玛丽 1573/79220≈1.985610%
generation.symbol.12.normal-weight=754
generation.symbol.12.mary-weight=1573
# ID 13 = Wild；普通 200/43384≈0.460999%；玛丽 482/79220≈0.608432%
generation.symbol.13.normal-weight=200
generation.symbol.13.mary-weight=482

# 正式 Redis 使用系统安全随机源自然随机：零倍及正倍数按实际倍率 Key 写入；独立单页无奖 Spin 按可见 x2 球数用 #/#1/#2/#3，连消结束页和免费触发页保留原编码
