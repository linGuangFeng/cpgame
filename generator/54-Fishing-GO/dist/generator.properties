# Fishing GO 54 Redis loader. SecureRandom only. Counts from 1241 training origin rounds.
# paid 18615: A=1945 J=1977 K=2008 Q=1996 S1=2462 S2=2335 S3=2098 S4=2160 SC=1119 WILD=515
# caps: wild col<=2 page paid<=5 free<=3; SC col<=2 paid<=7 free reel<=1 page<=4; WILD not on reel 0/4
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.ssl=false
redis.username=
redis.password=
redis.game-id=8000054
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=20。 倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。
generation.loss-count=100000000
generation.win-count=100000000
generation.special-count=100000000
generation.max-members-per-multiplier=300
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=6000
generation.special-min-win-multiplier=100
generation.special-max-win-multiplier=6000
generation.special-max-members-per-multiplier=100

