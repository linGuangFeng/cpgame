# Cyber GO 52：完整 Round 直接生成并批量写入 Redis。正式 Loader 使用 SecureRandom。

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID
redis.game-id=8000052
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=30（只影响扣费 ba=bs×bl×30，不进倍数分母）。
# Redis 倍数 = 奖金/(betSize×betLevel)。旧桶按 /ba 存，已放大 30 倍到真实倍数；改后请清空 Redis 再生成。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：普通正倍 / 特殊免费 / 未中奖 0 倍分别计数
generation.normal-count=100000000
generation.special-count=100000000
generation.loss-count=100000000
# 每批在同一个 Redis MULTI/EXEC 中提交 ZADD + RPUSH + LTRIM
generation.batch-size=100

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50
generation.max-consecutive-wins=20
generation.special-max-steps=15

# 倍数范围：正倍完整局低于最小或超过最大则丢弃；0 倍走 0 桶，不套最小倍数
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=9000
generation.special-min-win-multiplier=120
generation.special-max-win-multiplier=9000

# 经验条件卷轴模型的边际计数；选择单位仍为三格窗口，不逐格拼接。
