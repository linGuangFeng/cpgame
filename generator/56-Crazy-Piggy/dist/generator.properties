# Crazy Piggy 56：完整 Round 直接生成并批量写入 Redis

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID
redis.game-id=8000056
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 所有完整局统一 PerKeyList_%09d + BetLog:0%08d:%06d，不再写入 Mary。
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=9（只计能中奖格子），中奖线数=5。 倍数单位默认 1。
# 当前采用穷举覆盖灌库：普通穷举 8^9 张中奖牌面；轮盘按可达倍率结构枚举后写入同一普通池。
# 只处理下方最小／最大范围内的可达倍率；每档达到保留数量即停止，不按总局数反复生成。
# 每档先轮流覆盖直出中奖与轮盘中奖，再轮流覆盖各方式的中奖结构。
# 所有玩法共用 normal 范围和每档数量；容量不足以覆盖全部结构时随机起点轮转。
# 此策略用于覆盖缓存，不代表原厂自然出奖概率或 RTP。

# 【已停用：总生成次数】穷举按倍率桶容量自动结束，不需要配置；旧数字仅注释留档。
# generation.loss-count=100000000
# generation.win-count=100000000
# generation.special-count=100000000
# 每次提交 Redis 的批次数量，仍然生效，仅影响写入批次，不决定总生成局数。
generation.batch-size=100

# 【牌面数量】每个倍率桶最多保留的完整局数量；也是本次穷举每档的生成目标。
generation.max-members-per-multiplier=300
# 已停用：统一普通池，此旧值仅留档。
# generation.special-max-members-per-multiplier=100

# 【完整局上限】仍参与约束轮盘派奖步数，不能注释。
# 普通只有一个中奖 Step；Booster Wheel 最多为初始奖加六个轮盘派奖 Delivery
generation.max-consecutive-wins=7

# 【倍数范围】最小／最大均保留且生效，只生成范围内可达的倍率档；不改变已有数字。
# 0 倍也受范围约束，仅当普通最小值为 0 时生成零倍桶。
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=2500
# 已停用：统一普通池，此旧值仅留档。
# generation.special-min-win-multiplier=25
# generation.special-max-win-multiplier=2500

# 【已停用：模式权重】轮盘结构按可达倍率枚举覆盖，不按概率选择；旧数字仅留档。
# 以下模式／符号权重均不参与正式穷举 Loader，即使取消注释也不会影响灌库。
# generation.mode.ordinary.weight=98
# generation.mode.booster-wheel.weight=2

# 1256 个普通完整 kernel（11304 格）与 36 个 Booster kernel（324 格）的边际计数。
# 【已停用：牌面权重】完整枚举后无重复选择盘面，不需要权重；以下仅为历史记录。
