# Hotpot 1830：完整局直接生成并批量写入 Redis
# 运行前 Redis 必须已在 redis.host:redis.port 监听。Demo 缓存为 192.168.10.3:6379 db=15。
# 连不上只查网络和本配置，不准当规则 bug 改出牌。正式配置禁止 seed。

# Redis 连接
redis.host=18.234.101.161
redis.port=8021
redis.username=
redis.password=pssss@6j&NHIjpB
redis.database=0
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID；默认 raw gid 1830
redis.game-id=8001830
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=36（只计能中奖格子），中奖线数=20。 倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：每个 member 都是一局从付费开始到所有连消/免费结束的完整局
# 普通/特殊是两个随机开局入口，每生成 1000 次换入口；特殊入口开局 Scatter(id=11) 权重为普通入口的 10 倍（代码写死）
# 购买不是独立玩法，不另做购买池；Scatter Free Spins 按实际结果写入 MaryKeyList/MaryLog
# 未中奖完整局由独立 LOSS 构造器写入 BetLog:…:000000，不计入下面的正倍 normal-count
generation.normal-count=80
generation.special-count=30

# 每生成多少局，用一个 Redis MULTI/EXEC 事务写入一次
generation.batch-size=20

# 本次启动时，普通/特殊奖池中每个实际倍率最多生成多少局；Redis 每个倍率 Key 只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100

# 单个 Spin 最大连续中奖/连消次数；自然下一页仍中奖则丢弃整个候选 Round
generation.max-consecutive-wins=10

# 一个完整 Round 中 Scatter 免费 Spin 的累计上限（含免费中追加）；超过则整局丢弃
generation.max-mary-spins=30

# 自然生成完整局的累计中奖倍数范围；低于最小或超过最大则整局丢弃，不追逐或强改
# 倍数是 ResultUtil 反推的整数 odd 合计×末页倍率因子，不是 total_win/bet_gold
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=1500
generation.mary-min-win-multiplier=100
generation.mary-max-win-multiplier=2000

# 牌面权重：实际概率 = 当前牌权重 / 当前场景全部23种牌权重总和
# 来源 protocol/1830-Hotpot/symbol-weight-empirical.json，REAL_PROVIDER 完整局逐格计数，不宣称等于原厂 RNG。
