# Lucky Panda 41：完整局直接生成并批量写入 Redis
# 运行前 Redis 必须已在 redis.host:redis.port 监听。Demo 缓存固定 192.168.10.3:6379 db=15。
# 连不上只检查网络和本配置，不要改出牌规则。
# 正式 Redis 使用系统安全随机源：配置禁止 seed。未中奖完整局写入 000000，供 Demo「先中不中，再倍率」。

# Redis 连接
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID；gid 41 Lucky Panda
redis.game-id=8000041
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=34（只计能中奖格子），中奖线数=20。 倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：每个 member 都是一局从付费开始到连消/免费结束的完整局
# 普通池含未中奖 000000 与正倍中奖；特殊池仅为 SCATTER_FREE_ROUNDS（购买不是玩法，不是 mali）
generation.normal-count=100000000
generation.special-count=100000000
generation.batch-size=1000
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=80
generation.max-consecutive-wins=10
generation.max-mary-spins=20

# 整数倍率 = 终局 rwa/(bs*bl)。0 必须写入普通未中奖池。
# 语料 200/200 普通中奖 + 38/38 免费 + 1095/1095 未中奖在 rwa/(bs*bl) 下为整数。
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=1500
generation.mary-min-win-multiplier=100
generation.mary-max-win-multiplier=2000

# 写入 member 的押注。语料 1333 个付费起点均为 bs=0.02 bl=1 ba=0.4。
generation.bet-size=0.02
generation.bet-level=1

# 牌面权重：实际概率 = 当前符号权重 / 当前场景 13 个权重总和。
# 建模只用 roundOrdinal % 13 != 0 的 1230 个原厂完整局；每 13 局留出 1 局（102 局）不参与权重。
# 来源 captures/41-Lucky-Panda/original-http-spin-index.jsonl + round-index.jsonl。
# 这是样本计数，不宣称等于原厂 reel strips、概率、RTP 或波动。禁止把 paid-start 套到补牌或免费。
# 场景分母：paid-start 41820 格（1230*34）；cascade-refill 11026 格（连消新发细胞，不含幸存）；
# free-start 11560 格（340 个免费起点）；free-cascade-refill 3047 格（免费连消新发）。
# Scat 触发符号抓包上限（Help/赔表无数字上限，因此用抓包最大个数；从未出现的个数不准生成）：
# 同一列可以出现 2 个 Scat（63 页）甚至 3 个（1 页）。列上限 3 个 RLE block / 4 细胞；
# 总上限 5 个 RLE block / 9 细胞。帮助允许免费再触发，免费页与付费页同一 Scat 上限。

# Pan 付费起点 652/41820≈1.559063%；连消新发 287/11026≈2.602938%；免费起点 212/11560≈1.833910%；免费连消新发 85/3047≈2.789629%
generation.symbol.Pan.paid-start-weight=652
generation.symbol.Pan.cascade-refill-weight=287
generation.symbol.Pan.free-start-weight=212
generation.symbol.Pan.free-cascade-refill-weight=85

