# Redis multiplier = award/(betSize×betLevel) integers (no ×100, lines not in divisor). Clear Redis before regen.
# Rio Carnival 45：完整 Round 按规则和逐牌经验权重生成并批量写入 Redis；JAR 不含旧模型资源。

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=30000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID
redis.game-id=8000045
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=15（只计能中奖格子），中奖线数=25。 倍数单位默认 1。
# 普通最小1 / 特殊最小125 / 普通最大1875 / 特殊最大2500：单位=奖金/(betSize×betLevel)。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 生成数量：普通正倍 / 特殊 / 未中奖分别计数
generation.normal-count=100000000
generation.special-count=100000000
generation.loss-count=100000000
# 每批 MULTI/EXEC；普通每个倍率最多 300 局，特殊最多 100 局
generation.batch-size=100
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50

# 正倍完整局累计倍数范围（单位 betSize×betLevel；25 线只影响扣费）
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=6250
generation.special-min-win-multiplier=125
generation.special-max-win-multiplier=7500

# 牌面逐牌权重来自真实盘面符号计数汇总，不加载旧模型资源。
