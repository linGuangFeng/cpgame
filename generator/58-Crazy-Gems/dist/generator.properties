# Crazy Gems 58：完整局直接生成并写入 Redis。0 倍不写缓存，由 Controller 配置表 round.loss-probability 走独立 0 倍生成器。
# Redis 必须已在 redis.host:redis.port 监听。

# Redis 连接
redis.host=127.0.0.1
redis.port=6379
redis.database=15
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000
redis.game-id=8000058
# 所有中奖结果统一使用 PerKeyList_0%08d + BetLog:0%08d:%06d，不区分普通/矿车奖励。
# 索引按最终中奖倍数×10（deci）记录；列表后缀为 6 位补零。例：200 表示 20 倍下注。
# 完整10位结果（9格符号+矿车倍率）在内存中去重，跨批次不重复写入。
# clear-existing=false 时先载入当前统一池参与去重；不负责清理已经存在的重复条目。
# 总目标继承原 normal-count + special-count；应小于可用唯一排面及分桶容量。
generation.total-members=100000000
generation.batch-size=100
generation.max-members-per-multiplier=300
generation.min-win-multiplier=1
generation.max-win-multiplier=500
generation.clear-existing=true

# 以下符号权重用于普通和特殊两个生成入口；特殊入口将 rpx>1 的配置权重乘 10。
# 符号权重来自 1160 个付费第一页、10440 格计数，不是原厂 RTP。
# WILD H1 H2 H3 H4 H5 H6 H7
generation.symbol.WILD.normal-weight=1182
generation.symbol.H1.normal-weight=1390
generation.symbol.H2.normal-weight=1437
generation.symbol.H3.normal-weight=1420
generation.symbol.H4.normal-weight=1302
generation.symbol.H5.normal-weight=1277
generation.symbol.H6.normal-weight=1210
generation.symbol.H7.normal-weight=1222
# rpx 1/2/3/5/10/15：177,293,229,186,136,139
generation.rpx.1.weight=177
generation.rpx.2.weight=293
generation.rpx.3.weight=229
generation.rpx.5.weight=186
generation.rpx.10.weight=136
generation.rpx.15.weight=139
