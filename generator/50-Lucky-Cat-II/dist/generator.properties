# Lucky Cat II 50：完整 Round 直接生成并批量写入 Redis

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=3000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID
redis.game-id=8000050
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=9（只计能中奖格子），中奖线数=5。 倍数单位默认 1。
# 普通最小 1，特殊最小 25（5×中奖线数）。普通最大 375（75×5），特殊最大 500（100×5）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 分类别预生成；0 倍未中奖也必须进入完整局池
generation.loss-count=100000000
generation.win-count=100000000
generation.special-count=100000000
# 每批在同一个 Redis MULTI/EXEC 中提交 ZADD + RPUSH + LTRIM
generation.batch-size=20

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50

# Lucky Cat II 最多付费 S01 + 一次免费 S02；没有连消链
generation.max-consecutive-wins=2

# 倍数范围：正倍完整局低于最小或超过最大则丢弃；0 倍走 0 桶，不套最小倍数
generation.normal-min-win-multiplier=0
generation.normal-max-win-multiplier=1250
generation.special-min-win-multiplier=30
generation.special-max-win-multiplier=1500

# 1465 条完整联合训练样本的边际计数，只作发牌权重参考。
# 正式出牌按五条线、Lucky 前缀 WILD 堆叠、Wheel 九格同符号构造，不抽联合样本盘。
# 普通首屏分母 12393；特殊首屏分母 792；Lucky 重转终屏分母 432。

generation.symbol.WILD.normal-weight=1492
generation.symbol.S1.normal-weight=1907
generation.symbol.S2.normal-weight=1786
generation.symbol.S3.normal-weight=1763
generation.symbol.S4.normal-weight=1739
generation.symbol.S5.normal-weight=1830
generation.symbol.S6.normal-weight=1876
generation.symbol.WILD.special-weight=336
generation.symbol.S1.special-weight=101
generation.symbol.S2.special-weight=81
generation.symbol.S3.special-weight=73
generation.symbol.S4.special-weight=99
generation.symbol.S5.special-weight=44
generation.symbol.S6.special-weight=58
generation.symbol.WILD.respin-weight=54
generation.symbol.S1.respin-weight=82
generation.symbol.S2.respin-weight=55
generation.symbol.S3.respin-weight=60
generation.symbol.S4.respin-weight=77
generation.symbol.S5.respin-weight=59
generation.symbol.S6.respin-weight=45

# 每轴 3 格牌型组合权重，和上面的符号权重分开。
# AAB=上两格相同，BAA=下两格相同，AAA=三格相同，ABC=三格都不同。实际概率 = 该牌型权重 / 四者之和。
generation.reel-pattern.AAB.weight=2
generation.reel-pattern.BAA.weight=2
generation.reel-pattern.AAA.weight=2
generation.reel-pattern.ABC.weight=1

