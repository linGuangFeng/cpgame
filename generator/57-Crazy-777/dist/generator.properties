# Crazy 777 57：完整 Round 直接生成并批量写入 Redis

# Redis 连接
redis.host=54.172.218.28
redis.port=8016
redis.database=0
redis.username=
redis.password=
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# Redis Key 使用的游戏 ID
redis.game-id=8000057
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=9（只计能中奖格子），中奖线数=5。 倍数单位默认 1。
# 普通最小 1，特殊最小 25（5×中奖线数）。普通最大 375（75×5），特殊最大 500（100×5）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# run-ordinary.cmd 只穷举普通奖；run-mary.cmd 只概率生成玛丽。
# runRedis 只传本文件，同一进程先普通奖再玛丽。
# 普通奖励写入 PerKeyList；loss-count / win-count 对穷举不生效。
# 玛丽（三轴可见 SC 触发）写入 MaryKeyList，special-count 仍生效。
# 0 倍仅当普通最小倍数为 0 时进入普通池。
generation.loss-count=100000000
generation.win-count=100000000
generation.special-count=100000000
# 每批在同一个 Redis MULTI/EXEC 中提交 ZADD + RPUSH + LTRIM
generation.batch-size=100

# 每个实际倍率 Key 最终只保留最新这些牌面
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=50

# 每个实际倍率 Key 最终只保留最新 300 局

# 普通 1 Step；免费为触发加 10 次 Delivery
generation.max-consecutive-wins=11

# 倍数范围：完整局倍率必须落在闭区间内；普通最小为 1 时不写 0 桶。
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=2500
generation.special-min-win-multiplier=25
generation.special-max-win-multiplier=2500

# 完整联合 kernel 的边际计数：普通首屏 17910 格、免费触发页 600 格、免费页 6000 格。
# 权重选择完整局；不会逐格重组 11 页免费局。
generation.symbol.BLANK.normal-weight=8848
generation.symbol.H1.normal-weight=1583
generation.symbol.H2.normal-weight=1182
generation.symbol.H3.normal-weight=1157
generation.symbol.H4.normal-weight=1206
generation.symbol.H5.normal-weight=1197
generation.symbol.H6.normal-weight=1200
generation.symbol.SC.normal-weight=1062
generation.symbol.WILD.normal-weight=475
