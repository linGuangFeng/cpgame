# Coin Master GO（1407）完整 Round Redis Loader 正式配置
# 原厂服务端理论权重仍未知。以下数值不是缺省猜测，而是 501 个已保存付费 Round
# 起点中 12525 个 transport cell 的逐符号实测计数。正式 Loader 逐项读取；它们只形成
# 证据采样模型，不宣称等于原厂长期概率或 RTP。WILD 在 501 个起点中为0，只能由金牌变出。

# Redis 连接
redis.host=18.234.101.161
redis.port=8021
redis.username=
redis.password=pssss@6j&NHIjpB
redis.database=0
redis.ssl=false
redis.connect-timeout-ms=5000
redis.socket-timeout-ms=30000

# 平台 Redis Key 使用的游戏 ID
redis.game-id=8001407
# Redis Key 必须按 betLog「结果」页查询规则生成：
# 普通 PerKeyList_%09d + BetLog:0%08d:%06d ；特殊 MaryKeyList_%09d + MaryLog:%09d:%06d
# 倍率是整数 6 位左补 0；必须 ZADD 索引，结果页不扫自造前缀。
# 本游戏出奖位置=20（只计能中奖格子），中奖线数=20。倍数单位默认 1。
# 普通最小 1，特殊最小 100（5×中奖线数）。普通最大 1500（75×20），特殊最大 2000（100×20）。
# 普通每个倍率最多 300 个牌面；特殊每个倍率最多 100 个。

# 普通/特殊自然候选的最多生成目标；单项上限 100000000
# 普通/特殊是两个随机开局入口，每生成 1000 次换入口；特殊入口开局 SC 权重为普通入口的 10 倍（代码写死）
generation.normal-count=100000000
generation.special-count=100000000

# 每批在同一 MULTI/EXEC 内提交 ZADD、RPUSH、LTRIM
generation.batch-size=100
# 每个实际倍率 LIST 只保留最新 300 个完整 Round member
generation.max-members-per-multiplier=300
generation.special-max-members-per-multiplier=100
# 完整 Round 边界
generation.max-consecutive-wins=10
generation.max-mode-spins.freeSpins=36
generation.normal-min-win-multiplier=1
generation.normal-max-win-multiplier=1500
generation.special-min-win-multiplier=100
generation.special-max-win-multiplier=2000

# 当前游戏 501 个付费起点的实测计数；总计12525。权重就是可调整的相对概率：
# H1 1595/12525≈12.734531%；H2 1569/12525≈12.526946%；H3 1542/12525≈12.311377%
# H4 1489/12525≈11.888224%；H5 1508/12525≈12.039920%；H6 1547/12525≈12.351297%
# H7 1500/12525≈11.976048%；H8 1459/12525≈11.648703%；SC 316/12525≈2.522954%
# WILD 0/12525=0%，因为原始起始牌面没有直接 WILD；它只能由中奖金牌在连消中转化。
generation.symbol.H1.weight=1595
generation.symbol.H2.weight=1569
generation.symbol.H3.weight=1542
generation.symbol.H4.weight=1489
generation.symbol.H5.weight=1508
generation.symbol.H6.weight=1547
generation.symbol.H7.weight=1500
generation.symbol.H8.weight=1459
generation.symbol.WILD.weight=0
generation.symbol.SC.weight=316

# 第2-4轴每张非 WILD/SC 候选牌的材质权重；由501个起点的7310张候选牌反推。
# 银牌 5737/7310≈78.481532%；金牌 1573/7310≈21.518468%。两项可独立调整，
# 也允许其中一项设为0，但不能同时为0。0倍结果概率不在配置中：它由规则代码自然计算。
generation.card.silver.weight=5737
generation.card.gold.weight=1573

# 正式入口只使用系统 SecureRandom，自然生成完整 Round；配置中不提供随机种子。

# 独立零倍 Spin 写为 #；仅完整单步、无上下牌面关联且无免费触发时压缩。
# 连消结束步、金银牌继承、免费触发/重触发保留原编码；倍率0照常写入。
